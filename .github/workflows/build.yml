name: Build CLI

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch or tag to build
        required: true
        default: main
        type: string
      arch:
        description: Target architecture
        required: true
        default: both
        type: choice
        options:
          - both
          - amd64
          - arm64

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ inputs.branch }}, ${{ inputs.arch }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        id: build
        run: |
          set -euo pipefail
          mkdir -p dist

          BRANCH_SLUG=$(echo "${{ inputs.branch }}" | tr '/:' '-')
          VERSION=$(git describe --tags --always --dirty)
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          echo "branch_slug=${BRANCH_SLUG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "commit=${COMMIT}" >> "${GITHUB_OUTPUT}"

          LDFLAGS="-s -w \
            -X abstrax/internal/version.Version=${VERSION} \
            -X abstrax/internal/version.Commit=${COMMIT} \
            -X abstrax/internal/version.BuildDate=${DATE}"

          build_one() {
            local arch=$1
            echo "Building linux/${arch}..."
            GOOS=linux GOARCH="${arch}" CGO_ENABLED=0 go build \
              -ldflags="${LDFLAGS}" \
              -o "dist/abstrax-linux-${arch}" \
              ./cmd/abstrax
          }

          case "${{ inputs.arch }}" in
            amd64) build_one amd64 ;;
            arm64) build_one arm64 ;;
            both)  build_one amd64; build_one arm64 ;;
          esac

          {
            echo "branch=${{ inputs.branch }}"
            echo "arch=${{ inputs.arch }}"
            echo "version=${VERSION}"
            echo "commit=${COMMIT}"
            echo "build_date=${DATE}"
            echo "workflow_run=${{ github.run_id }}"
            echo "workflow_number=${{ github.run_number }}"
          } > dist/build-info.txt

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          BRANCH_SLUG: ${{ steps.build.outputs.branch_slug }}
          ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail

          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ] || [ -z "${R2_ACCOUNT_ID}" ] || [ -z "${R2_BUCKET}" ]; then
            echo "Missing R2 secrets. Required repository secrets:"
            echo "  R2_ACCOUNT_ID"
            echo "  R2_ACCESS_KEY_ID"
            echo "  R2_SECRET_ACCESS_KEY"
            echo "  R2_BUCKET"
            echo "Optional:"
            echo "  R2_PUBLIC_BASE_URL  (e.g. https://downloads.example.com)"
            exit 1
          fi

          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          PREFIX="abstrax/test-builds/${BRANCH_SLUG}/${{ github.run_number }}"

          upload_file() {
            local file=$1
            local key="${PREFIX}/$(basename "${file}")"
            echo "Uploading ${file} -> s3://${R2_BUCKET}/${key}"
            aws s3 cp "${file}" "s3://${R2_BUCKET}/${key}" \
              --endpoint-url "${ENDPOINT}" \
              --content-type application/octet-stream
          }

          case "${ARCH}" in
            amd64) upload_file dist/abstrax-linux-amd64 ;;
            arm64) upload_file dist/abstrax-linux-arm64 ;;
            both)
              upload_file dist/abstrax-linux-amd64
              upload_file dist/abstrax-linux-arm64
              ;;
          esac
          upload_file dist/build-info.txt

          {
            echo "## R2 upload complete"
            echo
            echo "| File | Object key |"
            echo "|---|---|"
            for f in dist/abstrax-linux-* dist/build-info.txt; do
              [ -f "${f}" ] || continue
              key="${PREFIX}/$(basename "${f}")"
              echo "| \`$(basename "${f}")\` | \`${key}\` |"
            done
            echo
            if [ -n "${R2_PUBLIC_BASE_URL}" ]; then
              echo "### Download URLs"
              echo
              BASE="${R2_PUBLIC_BASE_URL%/}"
              for f in dist/abstrax-linux-*; do
                [ -f "${f}" ] || continue
                echo "- [${BASE}/${PREFIX}/$(basename "${f}")](${BASE}/${PREFIX}/$(basename "${f}"))"
              done
              echo
              echo "On a test server:"
              echo
              echo '```bash'
              for f in dist/abstrax-linux-*; do
                [ -f "${f}" ] || continue
                echo "curl -fsSL -o abstrax '${BASE}/${PREFIX}/$(basename "${f}")'"
                echo "chmod +x abstrax"
                echo "sudo mv abstrax /usr/local/bin/abstrax"
                break
              done
              echo '```'
            else
              echo "Set secret \`R2_PUBLIC_BASE_URL\` (custom domain or r2.dev URL) to print direct download links in this summary."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
